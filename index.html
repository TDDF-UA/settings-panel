<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>What am I holding? — Settings</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>

  <video id="webcam" autoplay playsinline muted aria-hidden="true"></video>

  <header id="top-bar">
    <span id="dot" aria-hidden="true"></span>
    <span id="status-text">Point your camera at an object</span>
    <button id="restart-btn" class="chip-btn" hidden>Restart</button>
  </header>

  <div id="start-screen">
    <div id="start-card">
      <h1>What am I holding?</h1>
      <p>Point your camera at the object. It reads the answer out loud.</p>
      <button id="start-btn">Start listening</button>
      <p id="start-error" role="alert"></p>
    </div>
  </div>

  <main id="main-panel">
    <div id="guess-card">
      <div id="guess" aria-live="polite">—</div>
      <div id="confidence-row">
        <span id="confidence"></span>
        <button id="repeat-btn" aria-label="Say it again" hidden>&#8635; Say it again</button>
      </div>
    </div>

    <section id="settings-panel">
      <button id="settings-toggle" aria-expanded="false" aria-controls="settings-body">
        <span aria-hidden="true">&#9881;</span> Settings
      </button>

      <div id="settings-body" hidden>

        <fieldset class="setting-group">
          <legend>Text size</legend>
          <div class="setting-options" role="group" aria-label="Text size">
            <button type="button" class="option-btn" data-textsize="normal" aria-pressed="true">Normal</button>
            <button type="button" class="option-btn" data-textsize="large" aria-pressed="false">Large</button>
            <button type="button" class="option-btn" data-textsize="xl" aria-pressed="false">Extra large</button>
          </div>
        </fieldset>

        <fieldset class="setting-group">
          <legend>Contrast</legend>
          <div class="setting-options">
            <label class="toggle-row">
              <input type="checkbox" id="contrast-toggle" />
              <span>High contrast (black background, white text)</span>
            </label>
          </div>
        </fieldset>

        <fieldset class="setting-group">
          <legend>Speech rate</legend>
          <div class="setting-options" role="group" aria-label="Speech rate">
            <button type="button" class="option-btn" data-rate="slow" aria-pressed="false">Slow</button>
            <button type="button" class="option-btn" data-rate="normal" aria-pressed="true">Normal</button>
            <button type="button" class="option-btn" data-rate="fast" aria-pressed="false">Fast</button>
          </div>
        </fieldset>

        <p class="settings-note">These settings apply for this session only and reset when the page reloads.</p>
      </div>
    </section>
  </main>

  <span id="sr-announce" class="sr-only" aria-live="assertive"></span>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <script src="./script.js"></script>
</body>
</html>
